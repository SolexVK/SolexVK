# Experiment registry — pre-register every hypothesis BEFORE testing it.
# This is the p-hacking guard: FDR correction is applied across the whole
# campaign (all tests below), not per-test. A finding is "real" only if it
# survives corrected significance AND out-of-sample AND an independent seed.
#
# status: proposed | tested | rejected | confirmed
# Add new hypotheses at the bottom; never edit a result after the fact.

campaign: 5x36plus
alpha: 0.05
correction: benjamini-hochberg

hypotheses:
  - id: H001
    sprint: 1
    claim: "The main field (5 of 36) is drawn uniformly at random."
    statistic: "chi-square goodness-of-fit, df=35"
    null_model: "uniform pool, sampling without replacement"
    result: "not rejected (p=0.9876) — consistent with fair"
    status: confirmed-fair

  - id: H002
    sprint: 1
    claim: "The plus field (1 of 4) is drawn uniformly at random."
    statistic: "chi-square goodness-of-fit, df=3"
    result: "not rejected (p=0.6551) — consistent with fair"
    status: confirmed-fair

  - id: H003
    sprint: 1
    claim: "No individual number 1..36 deviates from its expected rate."
    statistic: "36 exact binomial tests + Benjamini-Hochberg FDR"
    result: "0 of 36 significant after FDR (min raw p=0.134)"
    status: confirmed-fair

  - id: H004
    sprint: 1
    claim: "The per-draw sum series has no serial dependence."
    statistic: "Ljung-Box Q over 20 lags; runs test around median"
    result: "Ljung-Box p=0.22, runs p=0.99 — no dependence"
    status: confirmed-fair

  - id: H010
    sprint: 2
    claim: "Players pick numbers non-uniformly (favouring low/calendar numbers)."
    statistic: "per-number delta of lower-tier winner-rate vs Monte-Carlo uniform null; T=sum(delta^2)"
    result: "REJECTED uniformity: p=0.0020 (2-of-5 tier; robust on 3-of-5, p=0.0020). Spearman(popularity, number)=-0.50 -> smaller numbers over-picked. Most over-picked 17,11,7,9,21,3; least 34,35,30,36,32. NOTE: 5x36plus lower tiers pay a fixed per-draw amount, so this edge only bites on the shared СУПЕР jackpot."
    status: confirmed-nonuniform

  - id: H011
    sprint: 2
    claim: "Some draws have positive expected value (rollover / prize-fund structure)."
    statistic: "realized RTP = summPayed/stakes; EV(jackpot) vs price threshold"
    result: "REJECTED: realized RTP=51.8% (house edge 48.2%). EV turns positive only above a ~66M rub СУПЕР-1 jackpot; observed max is 18.8M. No positive-EV draw exists."
    status: confirmed-negative-ev

  - id: H020
    sprint: 3
    claim: "A history-based number-picking strategy beats random selection out-of-sample."
    statistic: "walk-forward backtest (23043 draws); mean matches vs analytic random null; z-test + BH-FDR"
    result: "REJECTED for all 7 tested strategies (hot, cold, overdue, repeat-last, delta, popular, unpopular): 0 survive FDR. Every strategy scores ~0.694 matches/draw = random. repeat-last dips to raw p=0.024 but z<0 (worse) and fails FDR. Harness is open for user strategies via lab/backtest.py STRATEGIES."
    status: confirmed-no-edge

  # ---- your turn: drop a strategy into lab/backtest.py STRATEGIES and pre-register it here ----
