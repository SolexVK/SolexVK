<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тай-Чи</title>
<meta name="description" content="Личный курс Тай-Чи и цигун: занятия с голосовым наставником, контроль осанки камерой, дневник и прогресс.">
<meta name="theme-color" content="#f2ebdd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тай-Чи">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>try { var p = (JSON.parse(localStorage.getItem('taichi.state.v1') || '{}').settings || {}).palette; if (p && p !== 'auto') document.documentElement.dataset.palette = p; } catch (e) {}</script>
</head>
<body>
<div class="scenery" aria-hidden="true">
  <svg viewBox="0 0 900 400" preserveAspectRatio="xMidYMax slice">
    <circle class="sun" cx="690" cy="120" r="46"/>
    <path fill="currentColor" opacity="0.55" d="M0 250 C60 225 95 175 150 182 C200 188 225 232 270 226 C330 218 350 150 410 140 C470 130 500 205 560 210 C615 214 640 168 700 160 C770 152 820 210 900 205 V400 H0 Z"/>
    <path fill="currentColor" opacity="0.8" d="M0 300 C70 290 110 248 170 252 C240 256 270 300 340 292 C410 284 440 236 500 238 C560 240 590 290 660 292 C730 294 780 262 840 262 C870 262 890 270 900 274 V400 H0 Z"/>
    <path fill="currentColor" d="M0 352 C90 338 150 322 240 330 C330 338 380 360 470 354 C560 348 620 320 720 324 C800 328 860 344 900 348 V400 H0 Z"/>
  </svg>
</div>
<div id="app">
  <header class="top">
    <span class="seal-mark" aria-hidden="true">太極</span>
    <div class="top-text">
      <h1 id="view-title">Сегодня</h1>
      <p id="view-sub"></p>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </header>

  <main id="main"></main>

  <nav class="tabs" aria-label="Разделы">
    <button class="tab" data-view="today">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a4.25 4.25 0 0 1 0 8.5 4.25 4.25 0 0 0 0 8.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Сегодня</span>
    </button>
    <button class="tab" data-view="diary">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 4h11a1 1 0 0 1 1 1v15H7a1 1 0 0 1-1-1zM10 9h5M10 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Дневник</span>
    </button>
    <button class="tab" data-view="progress">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 19h16M5 15l4-4 3.5 3L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Прогресс</span>
    </button>
    <button class="tab" data-view="master">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 5h14v10H10l-4 4v-4H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Мастер</span>
    </button>
  </nav>
</div>

<div id="session" hidden></div>
<div id="sheet" hidden><div id="sheet-body" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>

<noscript><p style="padding:24px">Для работы приложения нужен JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
